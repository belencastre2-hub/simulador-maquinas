<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venda a sua máquina</title>

<style>
body {
  font-family: Inter, Arial;
  background: #0b1120;
  color: white;
  display:flex;
  justify-content:center;
  padding:40px;
}

.container {
  width: 480px;
  background: #111827;
  padding: 30px;
  border-radius: 20px;
}

h1 {
  font-size: 22px;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 14px;
  opacity: 0.7;
  margin-bottom: 20px;
}

label {
  font-size: 13px;
  opacity: 0.8;
}

input, select, textarea, button {
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}

input, select, textarea {
  background:#1f2937;
  color:white;
}

button {
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.success {
  margin-top:20px;
  padding:15px;
  background:#022c22;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Venda a sua máquina</h1>
<p class="subtitle">Receba uma proposta em menos de 24h</p>

<form id="form">

<label>Tipo de máquina</label>
<select required>
  <option>Escavadora</option>
  <option>Mini escavadora</option>
  <option>Retroescavadora</option>
  <option>Trator agrícola</option>
  <option>Pá carregadora</option>
  <option>Bulldozer</option>
  <option>Empilhador</option>
  <option>Grua</option>
  <option>Colheitadeira</option>
  <option>Outro</option>
</select>

<label>Marca</label>
<input placeholder="Ex: Caterpillar" required>

<label>Modelo</label>
<input placeholder="Ex: 320D" required>

<div class="grid">
<div>
<label>Ano</label>
<input type="number" required>
</div>

<div>
<label>Horas</label>
<input type="number">
</div>
</div>

<label>Estado geral</label>
<select>
  <option>Excelente</option>
  <option>Bom</option>
  <option>Usado</option>
  <option>Precisa reparação</option>
</select>

<label>Descrição (opcional)</label>
<textarea rows="3" placeholder="Detalhes adicionais..."></textarea>

<h3>Contacto</h3>

<input placeholder="Nome" required>
<input placeholder="Email" required>
<input placeholder="Telefone" required>

<button type="submit">Receber proposta</button>

</form>

<div class="success" id="success">
Pedido enviado com sucesso! Entraremos em contacto em breve.
</div>

</div>

<script>
const form = document.getElementById("form");

form.addEventListener("submit", function(e) {
  e.preventDefault();
  form.style.display = "none";
  document.getElementById("success").style.display = "block";
});
</script>

</body>
</html>
