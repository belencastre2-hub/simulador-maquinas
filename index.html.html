<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venda a sua máquina em 24h</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  display:flex;
  justify-content:center;
  padding:40px;
}

.container {
  background: rgba(255,255,255,0.05);
  padding:30px;
  border-radius:20px;
  width:420px;
  backdrop-filter: blur(20px);
}

h1 { font-size:20px; }

input, select, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

input, select {
  background: rgba(255,255,255,0.1);
  color:white;
}

button {
  background:#38bdf8;
  font-weight:bold;
  cursor:pointer;
}

.result {
  margin-top:20px;
  padding:15px;
  background:#020617;
  border-radius:10px;
}

.good {color:#22c55e;}
.mid {color:#facc15;}
.bad {color:#ef4444;}

.small {font-size:12px; opacity:0.7;}
</style>
</head>

<body>

<div class="container">

<h1>Descubra quanto vale a sua máquina</h1>

<select id="tipo">
  <option value="22000">Escavadora</option>
  <option value="16000">Trator</option>
  <option value="19000">Retroescavadora</option>
</select>

<input id="marca" placeholder="Marca (ex: Caterpillar)">
<input id="ano" type="number" placeholder="Ano">
<input id="horas" type="number" placeholder="Horas">

<h3>Condição</h3>

<label><input type="checkbox" id="oleo"> Fugas de óleo</label><br>
<label><input type="checkbox" id="ferrugem"> Ferrugem</label><br>
<label><input type="checkbox" id="motor"> Motor reparado</label><br>
<label><input type="checkbox" id="uso"> Uso intensivo</label><br>

<button onclick="calcular()">Calcular valor</button>

<div id="resultado" class="result"></div>

<h3>Receber proposta</h3>

<form action="https://formspree.io/f/COLOCA_AQUI" method="POST">

<input name="nome" placeholder="Nome" required>
<input name="email" placeholder="Email" required>

<input type="hidden" name="valor" id="valorHidden">

<button type="submit">Receber proposta</button>

</form>

</div>

<script>
function calcular(){

let base = parseFloat(tipo.value);
let ano = parseInt(document.getElementById("ano").value);
let horas = parseInt(document.getElementById("horas").value);
let marca = document.getElementById("marca").value.toLowerCase();

let idade = new Date().getFullYear() - ano;
let valor = base;

valor *= Math.pow(0.94, idade);
valor *= Math.pow(0.97, horas/1000);

if(marca.includes("caterpillar")) valor *= 1.1;
if(marca.includes("komatsu")) valor *= 1.05;

let risco = 0;

if(oleo.checked){ valor*=0.9; risco++; }
if(ferrugem.checked){ valor*=0.85; risco++; }
if(motor.checked){ valor*=0.88; risco++; }
if(uso.checked){ valor*=0.9; risco++; }

let confianca="Alta";
let cor="good";

if(idade>10 || horas>8000 || risco>=2){
  confianca="Média";
  cor="mid";
}

if(risco>=3){
  confianca="Baixa";
  cor="bad";
}

let min = Math.round(valor*0.9);
let max = Math.round(valor*1.15);

let texto = min+"€ - "+max+"€";

document.getElementById("resultado").innerHTML=
`<h2>${texto}</h2>
<p class="${cor}">Confiança: ${confianca}</p>
<p class="small">Baseado em dados reais de mercado</p>`;

document.getElementById("valorHidden").value = texto;
}
</script>

</body>
</html>
