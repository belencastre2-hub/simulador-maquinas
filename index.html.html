<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Avaliação de Máquinas | Oferta em 24h</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  padding: 40px;
}

.container {
  background: #1e293b;
  padding: 25px;
  border-radius: 15px;
  width: 420px;
}

h2 { margin-bottom: 10px; }

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #38bdf8;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  background: #020617;
  padding: 15px;
  border-radius: 10px;
}

.bad { color: #ef4444; }
.mid { color: #facc15; }
.good { color: #22c55e; }

.small { font-size: 12px; opacity: 0.7; }
</style>
</head>

<body>

<div class="container">

<h2>Simulador de Avaliação</h2>

<select id="tipo">
  <option value="22000">Escavadora</option>
  <option value="16000">Trator</option>
  <option value="19000">Retroescavadora</option>
</select>

<input id="marca" placeholder="Marca (ex: Caterpillar)">
<input id="ano" type="number" placeholder="Ano">
<input id="horas" type="number" placeholder="Horas">

<h3>Condição real</h3>

<label><input type="checkbox" id="oleo"> Fugas de óleo</label><br>
<label><input type="checkbox" id="ferrugem"> Ferrugem visível</label><br>
<label><input type="checkbox" id="motor"> Motor já reparado</label><br>
<label><input type="checkbox" id="diario"> Uso diário intensivo</label><br>

<button onclick="calcular()">Calcular Valor</button>

<div class="result" id="resultado"></div>

<h3>Receber proposta</h3>
<input id="nome" placeholder="Nome">
<input id="email" placeholder="Email">

<button onclick="guardar()">Guardar Lead</button>

</div>

<script>
function calcular() {
  let base = parseFloat(document.getElementById("tipo").value);
  let ano = parseInt(document.getElementById("ano").value);
  let horas = parseInt(document.getElementById("horas").value);
  let marca = document.getElementById("marca").value.toLowerCase();

  let idade = new Date().getFullYear() - ano;
  let valor = base;

  valor *= Math.pow(0.94, idade);
  valor *= Math.pow(0.97, horas / 1000);

  if (marca.includes("caterpillar")) valor *= 1.1;
  if (marca.includes("komatsu")) valor *= 1.05;

  let risco = 0;

  if (document.getElementById("oleo").checked) { valor *= 0.9; risco++; }
  if (document.getElementById("ferrugem").checked) { valor *= 0.85; risco++; }
  if (document.getElementById("motor").checked) { valor *= 0.88; risco++; }
  if (document.getElementById("diario").checked) { valor *= 0.9; risco++; }

  let confianca = "Alta";
  let classe = "good";

  if (idade > 10 || horas > 8000 || risco >= 2) {
    confianca = "Média";
    classe = "mid";
  }

  if (risco >= 3) {
    confianca = "Baixa";
    classe = "bad";
  }

  let min = Math.round(valor * 0.9);
  let max = Math.round(valor * 1.15);

  document.getElementById("resultado").innerHTML = `
    <h2>${min}€ – ${max}€</h2>
    <p class="${classe}">Confiança: ${confianca}</p>
    <p class="small">Estimativa baseada em idade, uso e condição real</p>
  `;
}

function guardar() {
  let lead = {
    nome: document.getElementById("nome").value,
    email: document.getElementById("email").value,
    valor: document.getElementById("resultado").innerText,
    data: new Date().toLocaleString()
  };

  let leads = JSON.parse(localStorage.getItem("leads") || "[]");
  leads.push(lead);
  localStorage.setItem("leads", JSON.stringify(leads));

  alert("Pedido enviado!");
}
</script>

</body>
</html>
